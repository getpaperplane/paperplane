name: Setup mobile compiler cache
description: Reuse native compilation results between clean mobile release builds.
inputs:
  cold-cache:
    description: Skip restoring compiler outputs for a cold-build measurement.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        if ! command -v ccache >/dev/null 2>&1; then
          if [[ "$RUNNER_OS" == macOS ]]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ccache
          fi
        fi

    - name: Configure compiler cache
      shell: bash
      run: |
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/mobile-ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          # Hosted runners reinstall compilers with different modification times.
          echo 'CCACHE_COMPILERCHECK=content'
          echo 'CCACHE_MAXSIZE=2G'
        } >> "$GITHUB_ENV"
        ccache --version

    # ccache checks compiler contents, flags (including ABI), sources and headers.
    # A new snapshot per run retains newly compiled files even on the same commit.
    - name: Restore and save compiler outputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/mobile-ccache
        key: mobile-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ inputs.cold-cache != 'true' && format('mobile-ccache-v1-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles('pnpm-lock.yaml')) || '' }}
          ${{ inputs.cold-cache != 'true' && format('mobile-ccache-v1-{0}-{1}-', runner.os, runner.arch) || '' }}

    - name: Reset compiler cache statistics
      shell: bash
      run: ccache --zero-stats
