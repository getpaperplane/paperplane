name: Release desktop build

# One desktop platform/arch build, called once per target from release.yml so
# each target is its own job with its own `needs`. The JS bundle (server, web
# client, Electron main) comes from the `js-bundle` artifact that build_bundle
# produced; this job only packages it, builds the native helpers, and, where
# `cli_archive` is set, the self-contained CLI archive for its platform.

on:
  workflow_call:
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      MACOS_PROVISIONING_PROFILE:
        required: false
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME:
        required: false
    inputs:
      label:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      rust_target:
        required: true
        type: string
      resource_key:
        required: true
        type: string
      # Whether the job also builds the self-contained CLI archive for its own
      # platform/arch, on this runner, and smoke-tests it here. Every archive
      # is built on hardware of its own architecture.
      cli_archive:
        required: false
        default: false
        type: boolean
      # Whether the job builds the desktop app. A CLI-only job (desktop: false,
      # cli_archive: true) splits a slow target's two builds across runners.
      desktop:
        required: false
        default: true
        type: boolean
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      release_channel:
        required: true
        type: string
      # Whether a `relay-client-tracing-config` artifact from the production
      # relay state is expected. PR previews carry no tracing config.
      relay_client_tracing:
        required: false
        default: true
        type: boolean
      clerk_publishable_key:
        required: true
        type: string
      clerk_jwt_template:
        required: true
        type: string
      clerk_cli_oauth_client_id:
        required: true
        type: string
      relay_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    # Windows waits for the same-arch Linux archive inside this budget.
    timeout-minutes: ${{ inputs.platform == 'win' && 70 || 30 }}
    env:
      ROVE_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk_publishable_key }}
      ROVE_CLERK_JWT_TEMPLATE: ${{ inputs.clerk_jwt_template }}
      ROVE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ inputs.clerk_cli_oauth_client_id }}
      ROVE_RELAY_URL: ${{ inputs.relay_url }}
    steps:
      # The windows-11-arm image runs jobs on its OS disk, where Defender scans
      # every write. A trusted Dev Drive mounted over the empty workspace keeps
      # checkout, the pnpm store, node_modules, and builds off that filter.
      # TEMP gets its own drive rather than a workspace folder: the desktop
      # build stages the packaged app there, and staging inside the repo would
      # resolve the repo's node_modules.
      - name: Mount Dev Drive over the workspace
        if: inputs.platform == 'win' && inputs.arch == 'arm64'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 40GB
          mount-path: ${{ github.workspace }}
          trusted-dev-drive: true

      # This repository is public, so Git needs no credentials. checkout's
      # credential cleanup runs submodule foreach even with submodules disabled,
      # which fails on the orphaned gitlinks in our vendored .repos tree.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            if git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"; then break; fi
            echo "git fetch attempt $attempt/4 failed" >&2
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((5 * 2 ** (attempt - 1)))
          done
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      # Only the desktop build needs these, but Ubuntu mirrors sometimes stall
      # for minutes, so the install starts in the background here and is
      # joined just before the desktop build.
      - uses: ./.github/actions/setup-apt-mirrors
        if: inputs.platform == 'linux'

      - name: Start Linux desktop build libraries install
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/apt.sh" <<'SCRIPT'
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get install -y imagemagick
          fi
          if command -v magick >/dev/null 2>&1; then magick -version; else convert -version; fi
          SCRIPT
          bash .github/scripts/background-start.sh apt bash "$RUNNER_TEMP/apt.sh"

      - name: Cache pinned Windows ARM PowerShell archive
        if: inputs.platform == 'win' && inputs.arch == 'arm64'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/PowerShell-7.4.20-win-arm64.zip
          key: powershell-win-arm64-7.4.20-67eff749d5dae357501c95a3eec1dcd93f669824e3ca2b1d2adcdecdebf04f35

      - name: Use PowerShell 7.4 for Windows ARM builds
        if: inputs.platform == 'win' && inputs.arch == 'arm64'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $version = "7.4.20"
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$version-win-arm64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "powershell-$version-arm64"
          if (!(Test-Path $archive)) {
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-arm64.zip" `
              -OutFile $archive
          }
          $expectedHash = "67eff749d5dae357501c95a3eec1dcd93f669824e3ca2b1d2adcdecdebf04f35"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "PowerShell archive checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $installDir
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$installDir\pwsh.exe" -NoProfile -NonInteractive -Command '$PSVersionTable; [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows ARM PowerShell selection
        if: inputs.platform == 'win' && inputs.arch == 'arm64'
        shell: pwsh
        run: |
          $expectedPath = Join-Path $env:RUNNER_TEMP "powershell-7.4.20-arm64\pwsh.exe"
          if ((Get-Command pwsh.exe).Source -ne $expectedPath -or $PSVersionTable.PSVersion -ne [version]"7.4.20") {
            throw "Windows ARM builds must use the pinned PowerShell runtime"
          }

      # Windows installs straight from the registry. There, linking the packages
      # takes the time, not downloading them, so a ~700 MB package cache did not
      # pay for its own restore. Across recent nightlies, restore plus install
      # took 183-233s on arm64 and 116-172s on x64, while a plain install took
      # 142-210s and 84-160s. The arm64 entries also filled 4 GB of the
      # repository's 10 GB Actions cache.
      - name: Test Windows signing
        if: inputs.platform == 'win'
        shell: pwsh
        run: ./scripts/windows-self-signed.test.ps1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      # setup-vp v1 has no restore-only input. Match its pinned implementation's
      # cache path/key, without its expensive post-job save. CI owns cache writes;
      # on a miss, install still fetches and verifies dependencies normally.
      - name: Locate Vite+ dependency cache
        if: inputs.platform != 'win'
        id: vp_cache
        shell: bash
        run: |
          echo "path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"

      - name: Restore Vite+ dependencies (no save)
        if: inputs.platform != 'win'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.vp_cache.outputs.path }}
          key: vite-plus-${{ runner.os }}-${{ steps.vp_cache.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-plus-${{ runner.os }}-${{ steps.vp_cache.outputs.arch }}-pnpm-
            vite-plus-${{ runner.os }}-${{ steps.vp_cache.outputs.arch }}-

      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      # Electron and electron-builder's packaging tools (fpm, NSIS, AppImage)
      # otherwise download from GitHub Releases on every run, which is slow and
      # fails the build whenever GitHub returns a 5xx. Both versions are pinned
      # in apps/desktop/package.json.
      - name: Locate Electron download caches
        if: inputs.desktop
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-downloads/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-downloads/electron-builder" >> "$GITHUB_ENV"

      - name: Cache Electron downloads
        if: inputs.desktop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/electron-downloads
          key: electron-downloads-v1-${{ inputs.platform }}-${{ inputs.arch }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-downloads-v1-${{ inputs.platform }}-${{ inputs.arch }}-

      - name: Install desktop dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=@rove-code/desktop... --filter=@rove-code/server... --filter=@rove-code/scripts...

      # Desktop staging, CLI archive staging, and the smoke test's runtime copy
      # each write tens of thousands of files under TEMP, which sits on the
      # Defender-scanned C: drive on both Windows images. Mounted after install so
      # pnpm keeps its own temp files on the store's volume.
      - name: Mount Dev Drive for TEMP
        if: inputs.platform == 'win'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 20GB
          drive-path: C:\rove_temp_drive.vhdx
          trusted-dev-drive: true
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}\tmp
            TMP,{{ DEV_DRIVE }}\tmp

      - name: Create TEMP directory
        if: inputs.platform == 'win'
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:TEMP | Out-Null

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/${{ inputs.rust_target }}/release/rove-resource-monitor${{ inputs.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ inputs.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        if: inputs.platform == 'linux'
        id: capture_helper_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            native/kde-snap-shot/target/${{ inputs.rust_target }}/release/rove-kde-snap-shot
            native/hyprland-snap-shot/target/${{ inputs.rust_target }}/release/rove-hyprland-snap-shot
          key: linux-capture-helpers-${{ inputs.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || (inputs.platform == 'linux' && steps.capture_helper_cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ inputs.rust_target }}

      - name: Download relay client tracing config
        if: inputs.relay_client_tracing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing

      - name: Load relay client tracing config
        if: inputs.relay_client_tracing
        shell: bash
        run: |
          config_path="$RUNNER_TEMP/relay-client-tracing/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^ROVE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          echo "::add-mask::$tracing_token"
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      # release.yml starts every platform without `needs` on the bundle (and
      # Windows without the Linux CLI archive), so setup overlaps those jobs and
      # each artifact is awaited just before its use.
      - name: Wait for JS bundle
        uses: ./.github/actions/wait-for-artifact
        with:
          name: js-bundle
          job: Build JS bundle

      # The artifact root is `apps/` (upload-artifact keeps the least common
      # ancestor of its paths), so extracting into `apps` restores
      # apps/server/dist and apps/desktop/dist-electron at their build paths.
      - name: Download JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Ensure Spectre-mitigated MSVC libs
        if: inputs.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $msvcToolset = Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC') -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $spectreArch = "${{ inputs.arch }}"
          if ($msvcToolset -and (Test-Path (Join-Path $msvcToolset.FullName "lib\spectre\$spectreArch\libcmt.lib"))) {
            Write-Host "Spectre-mitigated MSVC libraries already installed for $spectreArch."
            exit 0
          }
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.${{ inputs.arch == 'arm64' && 'ARM64' || 'x86.x64' }}.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Prepare Azure Trusted Signing
        if: inputs.platform == 'win' && vars.WINDOWS_SIGNING_MODE != 'self-signed'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Import self-signed Windows identity
        if: inputs.platform == 'win' && vars.WINDOWS_SIGNING_MODE == 'self-signed'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ./scripts/windows-self-signed.ps1 -Action Import

      - name: Import self-signed macOS identity
        if: inputs.platform == 'mac' && vars.MACOS_SIGNING_MODE == 'self-signed'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ vars.MACOS_SIGNING_IDENTITY || 'Rove Code Release Signing' }}
        run: bash scripts/import-macos-self-signed.sh

      # The CLI archive and the desktop app build concurrently and both ship
      # the resource monitor, so it is compiled once here, up front.
      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ inputs.rust_target }}"

      - name: Import macOS signing certificate for the CLI archive
        if: inputs.cli_archive && inputs.platform == 'mac' && vars.MACOS_SIGNING_MODE != 'self-signed'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "macOS CLI signing disabled (missing CSC_LINK); the archive is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/rove-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          cert_path="$RUNNER_TEMP/rove-cli-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in CSC_LINK." >&2
            exit 1
          fi
          echo "::add-mask::$keychain_password"
          echo "ROVE_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "macOS CLI signing enabled."

      - name: Stage resource monitor for the CLI archive
        if: inputs.cli_archive
        shell: bash
        run: |
          set -euo pipefail
          binary_name="rove-resource-monitor"
          if [[ "${{ inputs.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ inputs.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ inputs.rust_target }}/release/${binary_name}" "$target_dir/$binary_name"

      # The CLI archive (single-executable, archive, smoke test) builds in the
      # background while the desktop app builds; neither reads the other's
      # output. Linux joins it first instead, because the Windows jobs embed
      # the Linux archive as their WSL runtime and wait for its upload.
      #
      # The single-executable is built with a Node that supports --build-sea
      # (25.7+); the repo itself stays on the engines.node version. It always
      # injects into the runner's own Node: tsdown's cross-target download path
      # runs `tar` on a drive-letter path on Windows, which GNU tar reads as a
      # remote host, and a cross-built macOS binary cannot be smoke-tested.
      - name: Start CLI archive build
        if: inputs.cli_archive
        shell: bash
        env:
          ROVE_MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'developer-id' }}
          ROVE_WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'azure' }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.platform }}" == "mac" && "$ROVE_MACOS_SIGNING_MODE" == "self-signed" ]]; then
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [[ "${{ inputs.platform }}" == "mac" && -n "${APPLE_API_KEY:-}" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_cli_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
          fi
          cat > "$RUNNER_TEMP/cli-archive.sh" <<'SCRIPT'
          set -euo pipefail
          # The exact version, not a major: vp downloads it from nodejs.org/dist on
          # the runner, and only exact versions have a dist directory. Keep in
          # step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION=26.8.2 node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts \
            --platform "${{ inputs.platform }}" \
            --arch "${{ inputs.arch }}" \
            --version "${{ inputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          archive=(release-cli/*)
          node scripts/smoke-cli-archive.ts --archive "${archive[@]}" --expect-version "${{ inputs.version }}"
          SCRIPT
          bash .github/scripts/background-start.sh cli-archive bash "$RUNNER_TEMP/cli-archive.sh"

      - name: Finish CLI archive build
        if: inputs.cli_archive && inputs.platform == 'linux'
        shell: bash
        run: bash .github/scripts/background-join.sh cli-archive

      - name: Upload CLI archive
        if: inputs.cli_archive && inputs.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-cli/*
          if-no-files-found: error

      - name: Finish Linux desktop build libraries install
        if: inputs.platform == 'linux'
        shell: bash
        run: bash .github/scripts/background-join.sh apt

      - name: Wait for Linux CLI archive for WSL
        if: inputs.platform == 'win' && inputs.desktop
        uses: ./.github/actions/wait-for-artifact
        with:
          name: cli-linux-${{ inputs.arch }}
          job: Build Linux ${{ inputs.arch }}

      - name: Download Linux CLI archive for WSL
        if: inputs.platform == 'win' && inputs.desktop
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-${{ inputs.arch }}
          path: wsl-runtime

      - name: Build desktop artifact
        if: inputs.desktop
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          # Built (or restored) before the CLI archive, which ships it too.
          ROVE_DESKTOP_REUSE_RESOURCE_MONITOR: true
          ROVE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
          ROVE_MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'developer-id' }}
          ROVE_WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'azure' }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          ROVE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ inputs.platform }}"
            --target "${{ inputs.target }}"
            --arch "${{ inputs.arch }}"
            --build-version "${{ inputs.version }}"
            --skip-build
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ inputs.platform }}" == "mac" ]]; then
            if [[ "$ROVE_MACOS_SIGNING_MODE" == "self-signed" ]]; then
              if ! has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "${CSC_KEYCHAIN:-}"; then
                echo "Self-signed macOS releases require an imported CSC_LINK identity and CSC_KEY_PASSWORD." >&2
                exit 1
              fi
              unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
              unset ROVE_APPLE_TEAM_ID ROVE_MACOS_PROVISIONING_PROFILE
              echo "macOS certificate signing enabled without Apple notarization."
              mac_unnotarized=true
              args+=(--signed)
            elif [[ "$ROVE_MACOS_SIGNING_MODE" != "developer-id" ]]; then
              echo "MACOS_SIGNING_MODE must be developer-id or self-signed." >&2
              exit 1
            elif has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              if ! has_all "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
                echo "macOS signing is configured, but APPLE_TEAM_ID or MACOS_PROVISIONING_PROFILE is missing." >&2
                exit 1
              fi

              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              profile_path="$RUNNER_TEMP/rove.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              security cms -D -i "$profile_path" >/dev/null
              export ROVE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export ROVE_MACOS_PROVISIONING_PROFILE="$profile_path"

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
              mac_unsigned=true
              echo "::warning title=Unsigned macOS build::This DMG is not signed or notarized. See the job summary before installing it."
            fi
          elif [[ "${{ inputs.platform }}" == "win" ]]; then
            # Embed the Linux CLI archive built by the same-arch Linux job as
            # the WSL runtime. Required for a working WSL backend on Windows.
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/rove-*-linux-${{ inputs.arch }}.tar.gz)
            unset CSC_LINK CSC_KEY_PASSWORD
            if [[ "${ROVE_WINDOWS_SIGNING_MODE:-azure}" == "self-signed" ]]; then
              if ! has_all "${WIN_CSC_LINK:-}" "$WIN_CSC_KEY_PASSWORD" "${ROVE_WINDOWS_SIGNING_THUMBPRINT:-}"; then
                echo "Self-signed Windows builds require an imported WIN_CSC_LINK identity and WIN_CSC_KEY_PASSWORD." >&2
                exit 1
              fi
              args+=(--signed)
              echo "Windows self-signing enabled without Azure Trusted Signing."
            elif [[ "${ROVE_WINDOWS_SIGNING_MODE:-azure}" != "azure" ]]; then
              echo "WINDOWS_SIGNING_MODE must be azure or self-signed." >&2
              exit 1
            elif has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
            fi
          else
            echo "Signing disabled for ${{ inputs.platform }}."
          fi

          vp run dist:desktop:artifact "${args[@]}"

          if [[ "${{ inputs.platform }}" == "win" && "${ROVE_WINDOWS_SIGNING_MODE:-azure}" == "self-signed" ]]; then
            pwsh -NoProfile -NonInteractive -File scripts/windows-self-signed.ps1 -Action Verify -Path release
          fi

          if [[ "${mac_unnotarized:-false}" == "true" ]]; then
            found_zip=false
            for archive in release/*.zip; do
              [[ -f "$archive" ]] || continue
              found_zip=true
              verification_dir="$(mktemp -d "$RUNNER_TEMP/rove-macos-verify.XXXXXX")"
              ditto -x -k "$archive" "$verification_dir"
              found_app=false
              while IFS= read -r -d '' app; do
                bash scripts/verify-macos-self-signed.sh "$app"
                found_app=true
              done < <(find "$verification_dir" -type d -name '*.app' -prune -print0)
              if [[ "$found_app" != "true" ]]; then
                echo "No app was found in the update ZIP for signature verification." >&2
                exit 1
              fi
            done
            if [[ "$found_zip" != "true" ]]; then
              echo "No update ZIP was produced for signature verification." >&2
              exit 1
            fi
          fi

          if [[ "${mac_unsigned:-false}" == "true" || "${mac_unnotarized:-false}" == "true" ]]; then
            app_name="$(node -p "require('./apps/desktop/package.json').productName || 'Rove Code'")"
            if [[ "${{ inputs.release_channel }}" == "nightly" ]]; then
              app_name="Rove Code (Nightly)"
            fi
            {
              echo "### Installing this unnotarized macOS build"
              echo
              if [[ "${mac_unnotarized:-false}" == "true" ]]; then
                echo "This app is signed with the project's own certificate, not an Apple Developer ID. It is not notarized."
                echo "Keep the same signing certificate for future releases. Auto-update compatibility still requires a real two-version Mac test."
              else
                echo "This DMG is not signed or notarized by Apple."
              fi
              echo "Gatekeeper may block the first launch even when the download is intact."
              echo "After copying the app from the DMG to Applications, **only if you trust the download from this repository**, run:"
              echo
              echo '```sh'
              printf 'xattr -dr com.apple.quarantine "/Applications/%s.app"\n' "$app_name"
              echo '```'
              echo
              echo "This bypasses Gatekeeper's download check for this app; it does not verify that the app is safe. Do not disable Gatekeeper globally."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Finish CLI archive build
        if: inputs.cli_archive && inputs.platform != 'linux'
        shell: bash
        run: bash .github/scripts/background-join.sh cli-archive

      - name: Upload CLI archive
        if: inputs.cli_archive && inputs.platform != 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-cli/*
          if-no-files-found: error

      - name: Collect release assets
        if: inputs.desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          patterns=(
            "release/*.dmg"
            "release/*.zip"
            "release/*.AppImage"
            "release/*.deb"
            "release/*.exe"
            "release/*.cer"
          )
          # Preview builds have no publish config, so electron-builder writes
          # no feed manifest for them, but it still emits blockmaps beside the
          # installers. Neither belongs on a release no updater may follow.
          if [[ "${{ inputs.release_channel }}" != "preview" ]]; then
            patterns+=("release/*.blockmap" "release/*.yml")
          fi
          for pattern in "${patterns[@]}"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${{ inputs.platform }}" == "mac" && "${{ inputs.arch }}" != "arm64" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ inputs.arch }}.yml"
            done
          fi

          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml") and carries no arch, so the x64 and
          # arm64 jobs would upload the same name. Suffix each per-arch copy;
          # the release job merges them back into one manifest per channel.
          # builder-debug.yml is electron-builder's config dump, not a feed.
          if [[ "${{ inputs.platform }}" == "win" ]]; then
            for manifest in release-publish/*.yml; do
              [[ "$manifest" == */builder-debug.yml ]] && continue
              mv "$manifest" "${manifest%.yml}-win-${{ inputs.arch }}.yml"
            done
          fi

      - name: Collect resource monitor
        if: inputs.desktop
        shell: bash
        run: |
          set -euo pipefail
          binary_name="rove-resource-monitor"
          if [[ "${{ inputs.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          source_path="native/resource-monitor/target/${{ inputs.rust_target }}/release/${binary_name}"
          target_dir="resource-monitor-publish/${{ inputs.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload build artifacts
        if: inputs.desktop
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish/*
          if-no-files-found: error

      - name: Upload resource monitor
        if: inputs.desktop
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resource-monitor-${{ inputs.resource_key }}
          path: resource-monitor-publish/${{ inputs.resource_key }}/*
          if-no-files-found: error
