name: Deploy Paperplane Connect relay

on:
  push:
    branches:
      - main
  # Redeploys main after a variable or secret change. Alchemy redeploys the
  # Worker when a value it reads changes, so force is rarely needed, and it
  # replaces the Postgres runtime role (alchemy-run/alchemy#1832).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only (may initialize the free Cloudflare state-store Worker)"
        type: boolean
        required: true
        default: true
      force:
        description: Redeploy every resource, including ones with no detected changes. Replaces the Postgres runtime role.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy production relay
    # Requires Cloudflare, Neon, Clerk, and Axiom credentials. A manual run from
    # another branch would deploy that branch to production. Manual setup does not
    # enable Connect in release builds; automatic main deployments still require
    # the repository readiness gate.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PAPERPLANE_CLOUD_READY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH || 'production' }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      RELAY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_TUNNEL_CLEANUP_MODE }}
      RELAY_LEGACY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_LEGACY_TUNNEL_CLEANUP_MODE }}
      # Let the Free database suspend between maintenance runs.
      RELAY_MAINTENANCE_SCHEDULE: ${{ vars.RELAY_MAINTENANCE_SCHEDULE || '0 * * * *' }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENABLED: ${{ vars.APNS_ENABLED || 'true' }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=paperplane-relay...

      # Runs Alchemy directly: `vp run --filter` loads every workspace's Vite
      # config, and apps/server's needs dependencies the relay-only install skips.
      - name: Deploy production relay stage
        working-directory: infra/relay
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            npx alchemy plan --stage prod
          else
            npx alchemy deploy --stage prod --yes --no-input ${FORCE:+--force}
          fi
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          FORCE: ${{ inputs.force && 'true' || '' }}
          # The PublishClientConfig action writes the client env here instead
          # of the repo-root .env; nothing on the runner reads it.
          PAPERPLANE_RELAY_CLIENT_CONFIG_ENV: ${{ runner.temp }}/relay-client-config.env
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}

      - name: Publish relay deploy commit status
        uses: actions/github-script@v8
        with:
          script: |
            const dryRun = "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" === "true";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: dryRun ? "Relay plan / production" : "Relay deploy / production",
              description: dryRun ? "Relay production plan completed." : "Relay production deploy completed.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
